name: profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#111827,#3b0764,#6d28d9,#a855f7,#f472b6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render stats card (snake runs on its heatmap)
        env:
          # Optional repo secret STATS_TOKEN (PAT with repo scope) adds private repos' languages.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: python scripts/stats.py dist/snake-dark.svg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/generated
          git diff --cached --quiet || git commit -m "chore: refresh stats + snake"
          git push

