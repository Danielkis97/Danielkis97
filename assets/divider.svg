<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-labelledby="t d">
<title id="t">divider</title>
<desc id="d">An animated neon divider line.</desc>
<defs><linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee"/><stop offset=".75" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient><clipPath id="gap"><rect width="586" height="24"/><rect x="614" width="586" height="24"/></clipPath></defs>
<style>text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif} .beam{animation:beam 4.5s cubic-bezier(.6,0,.4,1) infinite}@keyframes beam{0%{transform:translateX(-320px)}100%{transform:translateX(1200px)}}.dia{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g clip-path="url(#gap)"><line x1="0" x2="1200" y1="12" y2="12" stroke="#1e293b" stroke-width="2"/><rect class="beam" x="0" y="10.5" width="320" height="3" rx="1.5" fill="url(#beam)"/></g><rect class="dia" x="594" y="6" width="12" height="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
</svg>
