<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="580" height="260" role="img" aria-labelledby="t d">
<title id="t">Habit Tracker</title>
<desc id="d">Card: a streak calendar fills up day by day next to current and longest streak counters.</desc>
