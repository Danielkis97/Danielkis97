<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="580" height="260" role="img" aria-labelledby="t d">
<title id="t">Project ████████ in progress</title>
<desc id="d">Card: a redacted stealth project with a radar sweep and the note clearance required.</desc>
<defs><linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".5" stop-color="#1e293b"/><stop offset="1" stop-color="#f472b6" stop-opacity=".55"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f87171" stop-opacity=".05"/><stop offset="1" stop-color="#f87171" stop-opacity=".55"/></linearGradient><radialGradient id="corner" cx="0" cy="0" r="1"><stop offset="0" stop-color="#f87171" stop-opacity=".16"/><stop offset=".6" stop-color="#f87171" stop-opacity="0"/></radialGradient><clipPath id="vclip"><rect width="216" height="216" rx="12"/></clipPath><pattern id="vscan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#000" fill-opacity=".22"/></pattern></defs>
<style>text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif} .blip{opacity:0;animation:blip 4s ease-out infinite}@keyframes blip{0%{opacity:1}60%,100%{opacity:0}}.redact{animation:redact 3s steps(1) infinite}@keyframes redact{0%,100%{opacity:1}46%{opacity:.25}48%{opacity:1}83%{opacity:.6}85%{opacity:1}}.blink{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="580" height="260" rx="16" fill="#05070d"/><rect x=".75" y=".75" width="578.5" height="258.5" rx="15.25" fill="none" stroke="url(#frameStroke)" stroke-width="1.5"/><rect x="1" y="1" width="578" height="258" rx="15" fill="url(#corner)"/><text x="26" y="40" font-size="11" letter-spacing="1.5" fill="#f87171">PROJECT 08<tspan fill="#334155">  //  </tspan><tspan fill="#64748b">STEALTH MODE</tspan></text><text x="26.0" y="74" font-size="22" fill="#fff" textLength="105.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Project </text><rect class="redact" x="131.6" y="56.0" width="105.6" height="23.1" rx="1.5" fill="#e2e8f0" style="animation-delay:-0.20s"/><text x="26" y="103" class="sans" font-size="24" font-weight="800" fill="#fff">in progress</text><text x="26.0" y="144" font-size="12" fill="#64748b" textLength="72.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">A browser </text><rect class="redact" x="98.0" y="134.2" width="57.6" height="12.6" rx="1.5" fill="#e2e8f0" style="animation-delay:-2.00s"/><text x="155.6" y="144" font-size="12" fill="#64748b" textLength="100.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve"> with on-chain</text><rect class="redact" x="26.0" y="153.2" width="57.6" height="12.6" rx="1.5" fill="#e2e8f0" style="animation-delay:-2.00s"/><text x="83.6" y="163" font-size="12" fill="#64748b" textLength="165.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">. Contracts, game loop,</text><text x="26.0" y="182" font-size="12" fill="#64748b" textLength="208.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the whole stack. Reveal: soon</text><text x="234.8" y="182" font-size="12" fill="#64748b" textLength="7.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">™</text><g class=""><rect x="26" y="208" width="84.0" height="22" rx="11.0" fill="#f87171" fill-opacity=".1" stroke="#f87171" stroke-opacity=".55"/><text x="35" y="223.0" font-size="11" fill="#f87171" textLength="66.0" lengthAdjust="spacingAndGlyphs">TypeScript</text></g><g class=""><rect x="117.0" y="208" width="70.8" height="22" rx="11.0" fill="#f87171" fill-opacity=".1" stroke="#f87171" stroke-opacity=".55"/><text x="126.0" y="223.0" font-size="11" fill="#f87171" textLength="52.8" lengthAdjust="spacingAndGlyphs">Solidity</text></g><g class=""><rect x="194.8" y="208" width="44.4" height="22" rx="11.0" fill="#f87171" fill-opacity=".1" stroke="#f87171" stroke-opacity=".55"/><text x="203.8" y="223.0" font-size="11" fill="#f87171" textLength="26.4" lengthAdjust="spacingAndGlyphs">????</text></g><g transform="translate(344,22)"><rect width="216" height="216" rx="12" fill="#05070d" stroke="#1e293b"/><g clip-path="url(#vclip)"><circle cx="108" cy="100" r="22" fill="none" stroke="#f87171" stroke-opacity=".3"/><circle cx="108" cy="100" r="46" fill="none" stroke="#f87171" stroke-opacity=".3"/><circle cx="108" cy="100" r="70" fill="none" stroke="#f87171" stroke-opacity=".3"/><line x1="30" x2="186" y1="100" y2="100" stroke="#f87171" stroke-opacity=".2"/><line x1="108" x2="108" y1="22" y2="178" stroke="#f87171" stroke-opacity=".2"/><g><animateTransform attributeName="transform" type="rotate" from="0 108 100" to="360 108 100" dur="4s" repeatCount="indefinite"/><path d="M108,100 L180,100 A72,72 0 0 0 163.2,53.7 Z" fill="url(#sweepg)"/></g><circle cx="151.3" cy="125.0" r="3.5" fill="#f87171" class="blip" style="animation-delay:0.33s"/><circle cx="82.0" cy="121.9" r="3.5" fill="#f87171" class="blip" style="animation-delay:1.56s"/><circle cx="87.5" cy="43.6" r="3.5" fill="#f87171" class="blip" style="animation-delay:2.78s"/><circle cx="127.9" cy="83.3" r="3.5" fill="#f87171" class="blip" style="animation-delay:3.56s"/><rect x="38" y="184" width="140" height="20" rx="3" fill="none" stroke="#f87171" class="redact"/><text x="108" y="198" font-size="9.5" fill="#f87171" text-anchor="middle" font-weight="700">CLEARANCE REQUIRED</text></g><rect width="216" height="216" rx="12" fill="url(#vscan)"/></g>
</svg>
