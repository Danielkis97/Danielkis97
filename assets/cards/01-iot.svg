 stroke="#22d3ee" stroke-opacity=".55"/><text x="222.2" y="223.0" font-size="11" fill="#22d3ee" textLength="46.2" lengthAdjust="spacingAndGlyphs">sklearn</text></g><g transform="translate(344,22)"><rect width="216" height="216" rx="12" fill="#05070d" stroke="#1e293b"/><g clip-path="url(#vclip)"><g transform="translate(46,58)"><path d="M-2,0 L-4,46 L4,46 L2,0Z" fill="#334155"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.6s" repeatCount="indefinite"/><path d="M0,0 L-3,-4 L0,-30 L3,-4Z" fill="#e2e8f0" transform="rotate(0)"/><path d="M0,0 L-3,-4 L0,-30 L3,-4Z" fill="#e2e8f0" transform="rotate(120)"/><path d="M0,0 L-3,-4 L0,-30 L3,-4Z" fill="#e2e8f0" transform="rotate(240)"/></g><circle r="3.5" fill="#fbbf24"/></g><text x="206" y="30" font-size="9.5" fill="#e2e8f0" text-anchor="end" >POST /predict</text><text x="206" y="44" font-size="9.5" fill="#a3e635" text-anchor="end" >200 OK · 12ms</text><text x="206" y="58" font-size="9" fill="#64748b" text-anchor="end" >IsolationForest</text><circle cx="122" cy="26" r="3.5" fill="#a3e635" class="blink"/><line x1="0" x2="216" y1="96" y2="96" stroke="#1e293b"/><g class="scroll"><path d="M0,119.4 L8,122.4 L16,120.7 L24,123.0 L32,123.3 L40,117.7 L48,117.1 L56,125.4 L64,119.6 L72,119.3 L80,127.0 L88,121.7 L96,125.4 L104,121.8 L112,123.4 L120,118.5 L128,123.3 L136,125.7 L144,122.2 L152,124.4 L160,123.7 L168,117.6 L176,124.6 L184,122.9 L192,120.0 L200,117.3 L208,125.7 L216,119.4 L224,122.4 L232,120.7 L240,123.0 L248,123.3 L256,117.7 L264,117.1 L272,125.4 L280,119.6 L288,119.3 L296,127.0 L304,121.7 L312,125.4 L320,121.8 L328,123.4 L336,118.5 L344,123.3 L352,125.7 L360,122.2 L368,124.4 L376,123.7 L384,117.6 L392,124.6 L400,122.9 L408,120.0 L416,117.3 L424,125.7 L432,119.4" fill="none" stroke="#22d3ee" stroke-width="1.6"/><text x="6" y="113" font-size="8" fill="#22d3ee" text-anchor="start" >temp</text><path d="M0,154.2 L8,155.8 L16,154.1 L24,156.2 L32,150.9 L40,155.0 L48,151.4 L56,156.4 L64,155.8 L7