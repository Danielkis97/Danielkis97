<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="580" height="260" role="img" aria-labelledby="t d">
<title id="t">Terraform AWS Infrastructure</title>
<desc id="d">Card: terraform apply draws a VPC, two subnets, two EC2 instances, a load balancer and an auto scaling group.</desc>
<defs><linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".5" stop-color="#1e293b"/><stop offset="1" stop-color="#f472b6" stop-opacity=".55"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><radialGradient id="corner" cx="0" cy="0" r="1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".16"/><stop offset=".6" stop-color="#fbbf24" stop-opacity="0"/></radialGradient><clipPath id="vclip"><rect width="216" height="216" rx="12"/></clipPath><pattern id="vscan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#000" fill-opacity=".22"/></pattern></defs>
<style>text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif} @keyframes tf0{0%,8%{opacity:0;transform:translateY(6px)}12%,92%{opacity:1;transform:none}100%{opacity:0}}.tf0{animation:tf0 9s ease-out infinite}@keyframes tf1{0%,16%{opacity:0;transform:translateY(6px)}20%,92%{opacity:1;transform:none}100%{opacity:0}}.tf1{animation:tf1 9s ease-out infinite}@keyframes tf2{0%,24%{opacity:0;transform:translateY(6px)}28%,92%{opacity:1;transform:none}100%{opacity:0}}.tf2{animation:tf2 9s ease-out infinite}@keyframes tf3{0%,32%{opacity:0;transform:translateY(6px)}36%,92%{opacity:1;transform:none}100%{opacity:0}}.tf3{animation:tf3 9s ease-out infinite}@keyframes tf4{0%,40%{opacity:0;transform:translateY(6px)}44%,92%{opacity:1;transform:none}100%{opacity:0}}.tf4{animation:tf4 9s ease-out infinite}@keyframes tf5{0%,48%{opacity:0;transform:translateY(6px)}52%,92%{opacity:1;transform:none}100%{opacity:0}}.tf5{animation:tf5 9s ease-out infinite}@keyframes tf6{0%,56%{opacity:0;transform:translateY(6px)}60%,92%{opacity:1;transform:none}100%{opacity:0}}.tf6{animation:tf6 9s ease-out infinite}@keyframes done{0%,68%{opacity:0}71%,92%{opacity:1}100%{opacity:0}}.done{animation:done 9s steps(1) infinite}.redact{animation:redact 3s steps(1) infinite}@keyframes redact{0%,100%{opacity:1}46%{opacity:.25}48%{opacity:1}83%{opacity:.6}85%{opacity:1}}.blink{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="580" height="260" rx="16" fill="#05070d"/><rect x=".75" y=".75" width="578.5" height="258.5" rx="15.25" fill="none" stroke="url(#frameStroke)" stroke-width="1.5"/><rect x="1" y="1" width="578" height="258" rx="15" fill="url(#corner)"/><text x="26" y="40" font-size="11" letter-spacing="1.5" fill="#fbbf24">PROJECT 05<tspan fill="#334155">  //  </tspan><tspan fill="#64748b">CLOUD · IaC</tspan></text><text x="26" y="74" class="sans" font-size="24" font-weight="800" fill="#fff">Terraform</text><text x="26" y="103" class="sans" font-size="24" font-weight="800" fill="#fff">AWS Infrastructure</text><text x="26.0" y="144" font-size="12" fill="#64748b" textLength="259.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">VPC, multi-AZ subnets, an ELB and an</text><text x="26.0" y="163" font-size="12" fill="#64748b" textLength="273.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Auto Scaling Group of EC2 web servers,</text><text x="26.0" y="182" font-size="12" fill="#64748b" textLength="244.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">all from a single terraform apply.</text><g class=""><rect x="26" y="208" width="77.4" height="22" rx="11.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".55"/><text x="35" y="223.0" font-size="11" fill="#fbbf24" textLength="59.4" lengthAdjust="spacingAndGlyphs">Terraform</text></g><g class=""><rect x="110.4" y="208" width="37.8" height="22" rx="11.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".55"/><text x="119.4" y="223.0" font-size="11" fill="#fbbf24" textLength="19.8" lengthAdjust="spacingAndGlyphs">AWS</text></g><g class=""><rect x="155.2" y="208" width="37.8" height="22" rx="11.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".55"/><text x="164.2" y="223.0" font-size="11" fill="#fbbf24" textLength="19.8" lengthAdjust="spacingAndGlyphs">HCL</text></g><g transform="translate(344,22)"><rect width="216" height="216" rx="12" fill="#05070d" stroke="#1e293b"/><g clip-path="url(#vclip)"><text x="12" y="22" font-size="9.5" fill="#e2e8f0" text-anchor="start" >$ terraform apply -auto-approve</text><text x="12" y="36" font-size="9" fill="#64748b">creating resources<tspan class="blink">...</tspan></text><g class="tf0"><rect x="14" y="44" width="188" height="140" rx="8" fill="none" stroke="#a78bfa" stroke-dasharray="4 3"/><text x="22" y="58" font-size="9" fill="#a78bfa">vpc</text></g><g class="tf1"><rect x="24" y="66" width="80" height="70" rx="5" fill="#0b1020" stroke="#1e293b"/><text x="30" y="78" font-size="8" fill="#64748b">subnet-a</text></g><g class="tf2"><rect x="112" y="66" width="80" height="70" rx="5" fill="#0b1020" stroke="#1e293b"/><text x="118" y="78" font-size="8" fill="#64748b">subnet-b</text></g><g class="tf3"><rect x="44" y="88" width="40" height="34" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.6"/><text x="64" y="109" font-size="9" fill="#fbbf24" text-anchor="middle">EC2</text></g><g class="tf4"><rect x="132" y="88" width="40" height="34" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.6"/><text x="152" y="109" font-size="9" fill="#fbbf24" text-anchor="middle">EC2</text></g><g class="tf5"><rect x="78" y="146" width="60" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-width="1.6"/><text x="108" y="163" font-size="9" fill="#22d3ee" text-anchor="middle">ELB</text><path d="M92,146 L64,122 M124,146 L152,122" stroke="#22d3ee" stroke-dasharray="3 3"/></g><g class="tf6"><text x="196" y="182" font-size="8" fill="#a3e635" text-anchor="end">ASG 2..4</text></g><g class="done"><text x="12" y="205" font-size="9.5" fill="#a3e635" text-anchor="start" font-weight="700">Apply complete! Resources: 7 added.</text></g></g><rect width="216" height="216" rx="12" fill="url(#vscan)"/></g>
</svg>
