<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="580" height="260" role="img" aria-labelledby="t d">
<title id="t">Sentiment Analysis of Movie Reviews</title>
<desc id="d">Card: review quotes split into tokens and a glowing sentiment gauge swings to negative or positive.</desc>
<defs><linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".5" stop-color="#1e293b"/><stop offset="1" stop-color="#f472b6" stop-opacity=".55"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><linearGradient id="sentg" x1="0" x2="1"><stop offset="0" stop-color="#f87171"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#a3e635"/></linearGradient><radialGradient id="corner" cx="0" cy="0" r="1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".16"/><stop offset=".6" stop-color="#fbbf24" stop-opacity="0"/></radialGradient><radialGradient id="vglow" cx=".5" cy="1" r=".9"><stop offset="0" stop-color="#fbbf24" stop-opacity=".18"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient><pattern id="vgrid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18,0 H0 V18" fill="none" stroke="#0f172a" stroke-width="1"/></pattern><clipPath id="vclip"><rect width="216" height="216" rx="12"/></clipPath><pattern id="vscan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#000" fill-opacity=".22"/></pattern></defs>
<style>text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif} .wd{opacity:0;animation:wd 10s linear infinite}@keyframes wd{0%{opacity:0;transform:translateY(-10px)}4%{opacity:1;transform:none}21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(14px)}}.redact{animation:redact 3s steps(1) infinite}@keyframes redact{0%,100%{opacity:1}46%{opacity:.25}48%{opacity:1}83%{opacity:.6}85%{opacity:1}}.blink{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="580" height="260" rx="16" fill="#05070d"/><rect x=".75" y=".75" width="578.5" height="258.5" rx="15.25" fill="none" stroke="url(#frameStroke)" stroke-width="1.5"/><rect x="1" y="1" width="578" height="258" rx="15" fill="url(#corner)"/><text x="26" y="40" font-size="11" letter-spacing="1.5" fill="#fbbf24">PROJECT 04<tspan fill="#334155">  //  </tspan><tspan fill="#64748b">NLP</tspan></text><text x="26" y="74" class="sans" font-size="24" font-weight="800" fill="#fff">Sentiment Analysis</text><text x="26" y="103" class="sans" font-size="24" font-weight="800" fill="#fff">of Movie Reviews</text><text x="26.0" y="144" font-size="12" fill="#64748b" textLength="259.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">IMDB reviews -&gt; tokenize, lemmatize,</text><text x="26.0" y="163" font-size="12" fill="#64748b" textLength="273.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">classify. A tuned Naive Bayes pipeline</text><text x="26.0" y="182" font-size="12" fill="#64748b" textLength="136.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">with 84%+ accuracy.</text><g class=""><rect x="26" y="208" width="44.4" height="22" rx="11.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".55"/><text x="35" y="223.0" font-size="11" fill="#fbbf24" textLength="26.4" lengthAdjust="spacingAndGlyphs">NLTK</text></g><g class=""><rect x="77.4" y="208" width="97.2" height="22" rx="11.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".55"/><text x="86.4" y="223.0" font-size="11" fill="#fbbf24" textLength="79.2" lengthAdjust="spacingAndGlyphs">scikit-learn</text></g><g class=""><rect x="181.60000000000002" y="208" width="57.6" height="22" rx="11.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".55"/><text x="190.60000000000002" y="223.0" font-size="11" fill="#fbbf24" textLength="39.6" lengthAdjust="spacingAndGlyphs">Python</text></g><g transform="translate(344,22)"><rect width="216" height="216" rx="12" fill="#05070d"/><g clip-path="url(#vclip)"><rect width="216" height="216" fill="url(#vgrid)"/><rect width="216" height="216" fill="url(#vglow)"/><g class="wd" style="animation-delay:0.0s"><text x="108" y="36" font-size="12" text-anchor="middle" fill="#a3e635" font-weight="700">"a masterpiece"</text><rect x="67.2" y="46" width="12.8" height="13" rx="3" fill="#0b1020" stroke="#1e293b"/><text x="71.2" y="55.5" font-size="8" fill="#e2e8f0">a</text><rect x="84.0" y="46" width="60.8" height="13" rx="3" fill="#0b1020" stroke="#1e293b"/><text x="88.0" y="55.5" font-size="8" fill="#e2e8f0">masterpiece</text></g><g class="wd" style="animation-delay:2.5s"><text x="108" y="36" font-size="12" text-anchor="middle" fill="#f87171" font-weight="700">"painfully boring"</text><rect x="60.0" y="46" width="51.2" height="13" rx="3" fill="#0b1020" stroke="#1e293b"/><text x="64.0" y="55.5" font-size="8" fill="#e2e8f0">painfully</text><rect x="115.2" y="46" width="36.8" height="13" rx="3" fill="#0b1020" stroke="#1e293b"/><text x="119.2" y="55.5" font-size="8" fill="#e2e8f0">boring</text></g><g class="wd" style="animation-delay:5.0s"><text x="108" y="36" font-size="12" text-anchor="middle" fill="#a3e635" font-weight="700">"loved every minute"</text><rect x="51.6" y="46" width="32.0" height="13" rx="3" fill="#0b1020" stroke="#1e293b"/><text x="55.6" y="55.5" font-size="8" fill="#e2e8f0">loved</text><rect x="87.6" y="46" width="32.0" height="13" rx="3" fill="#0b1020" stroke="#1e293b"/><text x="91.6" y="55.5" font-size="8" fill="#e2e8f0">every</text><rect x="123.6" y="46" width="36.8" height="13" rx="3" fill="#0b1020" stroke="#1e293b"/><text x="127.6" y="55.5" font-size="8" fill="#e2e8f0">minute</text></g><g class="wd" style="animation-delay:7.5s"><text x="108" y="36" font-size="12" text-anchor="middle" fill="#f87171" font-weight="700">"waste of time"</text><rect x="63.6" y="46" width="32.0" height="13" rx="3" fill="#0b1020" stroke="#1e293b"/><text x="67.6" y="55.5" font-size="8" fill="#e2e8f0">waste</text><rect x="99.6" y="46" width="17.6" height="13" rx="3" fill="#0b1020" stroke="#1e293b"/><text x="103.6" y="55.5" font-size="8" fill="#e2e8f0">of</text><rect x="121.2" y="46" width="27.2" height="13" rx="3" fill="#0b1020" stroke="#1e293b"/><text x="125.2" y="55.5" font-size="8" fill="#e2e8f0">time</text></g><text x="108" y="74" font-size="7.5" fill="#334155" text-anchor="middle" >tokenize -&gt; lemmatize -&gt; Naive Bayes</text><path d="M44,168 A64,64 0 0 1 172,168" fill="none" stroke="url(#sentg)" stroke-width="16" stroke-opacity=".18" filter="url(#softglow)"/><path d="M44,168 A64,64 0 0 1 172,168" fill="none" stroke="url(#sentg)" stroke-width="9" stroke-linecap="round"/><line x1="53.0" y1="168.0" x2="48.0" y2="168.0" stroke="#334155" stroke-width="1.5"/><line x1="55.7" y1="151.0" x2="50.9" y2="149.5" stroke="#334155" stroke-width="1.5"/><line x1="63.5" y1="135.7" x2="59.5" y2="132.7" stroke="#334155" stroke-width="1.5"/><line x1="75.7" y1="123.5" x2="72.7" y2="119.5" stroke="#334155" stroke-width="1.5"/><line x1="91.0" y1="115.7" x2="89.5" y2="110.9" stroke="#334155" stroke-width="1.5"/><line x1="108.0" y1="113.0" x2="108.0" y2="108.0" stroke="#334155" stroke-width="1.5"/><line x1="125.0" y1="115.7" x2="126.5" y2="110.9" stroke="#334155" stroke-width="1.5"/><line x1="140.3" y1="123.5" x2="143.3" y2="119.5" stroke="#334155" stroke-width="1.5"/><line x1="152.5" y1="135.7" x2="156.5" y2="132.7" stroke="#334155" stroke-width="1.5"/><line x1="160.3" y1="151.0" x2="165.1" y2="149.5" stroke="#334155" stroke-width="1.5"/><line x1="163.0" y1="168.0" x2="168.0" y2="168.0" stroke="#334155" stroke-width="1.5"/><g filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" dur="10s" repeatCount="indefinite" values="-55 108 168;55 108 168;55 108 168;-55 108 168;-55 108 168;55 108 168;55 108 168;-55 108 168;-55 108 168;-55 108 168" keyTimes="0.000;0.060;0.250;0.310;0.500;0.560;0.750;0.810;1.000;1.000" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 