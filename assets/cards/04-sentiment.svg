<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 260" width="580" height="260" role="img" aria-labelledby="t d">
<title id="t">Sentiment Analysis of Movie Reviews</title>
<desc id="d">Card: movie review quotes drop in and a sentiment gauge needle swings to negative or positive.</desc>
<defs><linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".5" stop-color="#1e293b"/><stop offset="1" stop-color="#f472b6" stop-opacity=".55"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><linearGradient id="sentg" x1="0" x2="1"><stop offset="0" stop-color="#f87171"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#a3e635"/></linearGradient><radialGradient id="corner" cx="0" cy="0" r="1"><stop offset="0" stop-color="#fbbf24" stop-opacity=".16"/><stop offset=".6" stop-color="#fbbf24" stop-opacity="0"/></radialGradient><clipPath id="vclip"><rect width="216" height="216" rx="12"/></clipPath><pattern id="vscan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#000" fill-opacity=".22"/></pattern></defs>
<style>text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace} .sans{font-family:'Segoe UI',Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif} .wd{opacity:0;animation:wd 10s linear infinite}@keyframes wd{0%{opacity:0;transform:translateY(-10px)}4%{opacity:1;transform:none}21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(14px)}}.redact{animation:redact 3s steps(1) infinite}@keyframes redact{0%,100%{opacity:1}46%{opacity:.25}48%{opacity:1}83%{opacity:.6}85%{opacity:1}}.blink{animation:blink 1.05s steps(1) infinite}@keyframes blink{50%{opacity:0}} @media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="580" height="260" rx="16" fill="#05070d"/><rect x=".75" y=".75" width="578.5" height="258.5" rx="15.25" fill="none" stroke="url(#frameStroke)" stroke-width="1.5"/><rect x="1" y="1" width="578" height="258" rx="15" fill="url(#corner)"/><text x="26" y="40" font-size="11" letter-spacing="1.5" fill="#fbbf24">PROJECT 04<tspan fill="#334155">  //  </tspan><tspan fill="#64748b">NLP</tspan></text><text x="26" y="74" class="sans" font-size="24" font-weight="800" fill="#fff">Sentiment Analysis</text><text x="26" y="103" class="sans" font-size="24" font-weight="800" fill="#fff">of Movie Reviews</text><text x="26.0" y="144" font-size="12" fill="#64748b" textLength="259.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">IMDB reviews -&gt; tokenize, lemmatize,</text><text x="26.0" y="163" font-size="12" fill="#64748b" textLength="273.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">classify. A tuned Naive Bayes pipeline</text><text x="26.0" y="182" font-size="12" fill="#64748b" textLength="136.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">with 84%+ accuracy.</text><g class=""><rect x="26" y="208" width="44.4" height="22" rx="11.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".55"/><text x="35" y="223.0" font-size="11" fill="#fbbf24" textLength="26.4" lengthAdjust="spacingAndGlyphs">NLTK</text></g><g class=""><rect x="77.4" y="208" width="97.2" height="22" rx="11.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".55"/><text x="86.4" y="223.0" font-size="11" fill="#fbbf24" textLength="79.2" lengthAdjust="spacingAndGlyphs">scikit-learn</text></g><g class=""><rect x="181.60000000000002" y="208" width="57.6" height="22" rx="11.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".55"/><text x="190.60000000000002" y="223.0" font-size="11" fill="#fbbf24" textLength="39.6" lengthAdjust="spacingAndGlyphs">Python</text></g><g transform="translate(344,22)"><rect width="216" height="216" rx="12" fill="#05070d" stroke="#1e293b"/><g clip-path="url(#vclip)"><g class="wd" style="animation-delay:0.0s"><text x="108" y="34" font-size="12" text-anchor="middle" fill="#a3e635">"a masterpiece"</text><text x="108" y="52" font-size="9" text-anchor="middle" fill="#64748b">tokenize -> lemmatize -> NB</text></g><g class="wd" style="animation-delay:2.5s"><text x="108" y="34" font-size="12" text-anchor="middle" fill="#f87171">"painfully boring"</text><text x="108" y="52" font-size="9" text-anchor="middle" fill="#64748b">tokenize -> lemmatize -> NB</text></g><g class="wd" style="animation-delay:5.0s"><text x="108" y="34" font-size="12" text-anchor="middle" fill="#a3e635">"loved every minute"</text><text x="108" y="52" font-size="9" text-anchor="middle" fill="#64748b">tokenize -> lemmatize -> NB</text></g><g class="wd" style="animation-delay:7.5s"><text x="108" y="34" font-size="12" text-anchor="middle" fill="#f87171">"waste of time"</text><text x="108" y="52" font-size="9" text-anchor="middle" fill="#64748b">tokenize -> lemmatize -> NB</text></g><path d="M42,168 A66,66 0 0 1 174,168" fill="none" stroke="url(#sentg)" stroke-width="10" stroke-linecap="round"/><line x1="50.0" y1="168.0" x2="42.0" y2="168.0" stroke="#334155" stroke-width="1.5"/><line x1="52.8" y1="150.1" x2="45.2" y2="147.6" stroke="#334155" stroke-width="1.5"/><line x1="61.1" y1="133.9" x2="54.6" y2="129.2" stroke="#334155" stroke-width="1.5"/><line x1="73.9" y1="121.1" x2="69.2" y2="114.6" stroke="#334155" stroke-width="1.5"/><line x1="90.1" y1="112.8" x2="87.6" y2="105.2" stroke="#334155" stroke-width="1.5"/><line x1="108.0" y1="110.0" x2="108.0" y2="102.0" stroke="#334155" stroke-width="1.5"/><line x1="125.9" y1="112.8" x2="128.4" y2="105.2" stroke="#334155" stroke-width="1.5"/><line x1="142.1" y1="121.1" x2="146.8" y2="114.6" stroke="#334155" stroke-width="1.5"/><line x1="154.9" y1="133.9" x2="161.4" y2="129.2" stroke="#334155" stroke-width="1.5"/><line x1="163.2" y1="150.1" x2="170.8" y2="147.6" stroke="#334155" stroke-width="1.5"/><line x1="166.0" y1="168.0" x2="174.0" y2="168.0" stroke="#334155" stroke-width="1.5"/><g><animateTransform attributeName="transform" type="rotate" dur="10s" repeatCount="indefinite" values="-55 108 168;55 108 168;55 108 168;-55 108 168;-55 108 168;55 108 168;55 108 168;-55 108 168;-55 108 168;-55 108 168" keyTimes="0.000;0.060;0.250;0.310;0.500;0.560;0.750;0.810;1.000;1.000" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/><line x1="108" y1="168" x2="108" y2="116" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><circle cx="108" cy="168" r="6" fill="#e2e8f0"/><text x="42" y="190" font-size="9" fill="#f87171" text-anchor="middle" font-weight="700">NEG</text><text x="174" y="190" font-size="9" fill="#a3e635" text-anchor="middle" font-weight="700">POS</text><text x="108" y="202" font-size="9" fill="#64748b" text-anchor="middle" >IMDB · acc 84%+</text></g><rect width="216" height="216" rx="12" fill="url(#vscan)"/></g>
